<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head><body>

</nav>

<aside class="social-sidebar" aria-label="Social links">
  <a class="social-icon" href="mailto:matthewkimmusic@gmail.com" aria-label="Email Matthew Kim" title="Email"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5h18v13H3z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></a>
  <a class="social-icon" href="https://www.instagram.com/matthewkimmusic/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.4" cy="6.7" r="1.15" fill="currentColor"/></svg></a>
  <a class="social-icon" href="https://www.linkedin.com/in/matthew-minjune-kim-a8986a354/" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7.3 10.2v6.5M7.3 7.5v.1M11.1 16.7v-3.5c0-2 1-3.1 2.7-3.1 1.7 0 2.9 1.1 2.9 3.3v3.3M11.1 12.9c0-1.6 1.1-2.8 2.8-2.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a>
</aside>


<section class="contact-banner">
  <img src="studio-photo.jpg" alt="Matthew Kim working in a mixing studio">
  <h1>Contact <em>Me</em></h1>
</section>

<main>
<section class="section">
 <div class="section-inner contact-grid">
  <form class="contact-form" id="contactForm" action="https://formspree.io/f/xppwzprj" method="POST" novalidate>
   <h2 class="form-heading">Send a Message</h2>
   <div class="form-row">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your name" required>
   </div>
   <div class="form-row">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>
   </div>
   <div class="form-row">
    <label for="subject">Subject</label>
    <input type="text" id="subject" name="subject" placeholder="What's this about?">
   </div>
   <div class="form-row">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" placeholder="Tell me a bit about your project..." required></textarea>
   </div>
   <button type="submit" class="btn form-submit">Send Message</button>
   <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
  </form>
 </div>
</section>
</main>

<footer>
  <div>© 2026 Matthew Kim</div>
</footer>
<script>
const menuBtn=document.querySelector('.menu');
const navLinks=document.querySelector('.nav-links');
menuBtn?.addEventListener('click',()=>{
 const isOpen=navLinks.classList.toggle('open');
 menuBtn.setAttribute('aria-expanded',isOpen);
});

const contactForm=document.getElementById('contactForm');
const formStatus=document.getElementById('formStatus');
const submitBtn=contactForm?.querySelector('.form-submit');

contactForm?.addEventListener('submit',async(e)=>{
 e.preventDefault();
 const name=document.getElementById('name').value.trim();
 const email=document.getElementById('email').value.trim();
 const message=document.getElementById('message').value.trim();

 if(!name||!email||!message){
  formStatus.textContent='Please fill in your name, email, and message.';
  formStatus.classList.add('error');
  return;
 }

 formStatus.classList.remove('error');
 formStatus.textContent='Sending…';
 submitBtn.disabled=true;

 try{
  const response=await fetch(contactForm.action,{
   method:'POST',
   body:new FormData(contactForm),
   headers:{'Accept':'application/json'}
  });

  if(response.ok){
   formStatus.textContent="Thanks — your message has been sent. I'll get back to you soon!";
   contactForm.reset();
  }else{
   const data=await response.json().catch(()=>null);
   formStatus.classList.add('error');
   formStatus.textContent=data?.errors?.length
    ? data.errors.map(err=>err.message).join(', ')
    : 'Something went wrong. Please try again or email me directly.';
  }
 }catch(err){
  formStatus.classList.add('error');
  formStatus.textContent='Something went wrong. Please try again or email me directly.';
 }finally{
  submitBtn.disabled=false;
 }
});
</script>
</body></html>
